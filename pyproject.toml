[project]
name = "emblem-rekindled-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
er = "emblem_dev.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emblem_dev"
module-root = "tools"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "gdtoolkit>=4.5.0",
    "ruff>=0.17.3",
]
